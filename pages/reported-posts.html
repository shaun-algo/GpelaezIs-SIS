    <main class="main-content" id="mainContent">
        <section id="reportedPostsSection" class="content-section active" aria-labelledby="reportedPostsTitle">
            <div class="page-header announcement-reports-page-header">
                <div>
                    <h1 class="page-title" id="reportedPostsTitle">Reported posts</h1>
                    <button type="button" class="announcement-reports-back" data-reports-back hidden>
                        <i class="fas fa-arrow-left" aria-hidden="true"></i>
                        <span>Back to reported posts</span>
                    </button>
                </div>
                <div class="announcement-reports-view-menu" id="reportedPostsViewMenu">
                    <button type="button"
                            class="announcement-menu-toggle announcement-reports-view-toggle"
                            data-reports-view-toggle
                            aria-expanded="false"
                            aria-controls="reportedPostsViewActions"
                            aria-label="Reported posts options"
                            title="Reported posts options">
                        <i class="fas fa-ellipsis-vertical" aria-hidden="true"></i>
                    </button>
                    <div class="announcement-action-menu announcement-reports-view-actions"
                         id="reportedPostsViewActions"
                         data-reports-view-menu
                         role="menu"
                         hidden>
                        <button type="button" role="menuitem" data-report-view-switch="removed">
                            <i class="fas fa-box-archive announcement-action-icon" aria-hidden="true"></i>
                            <span class="announcement-reports-view-option">
                                <strong>Removed posts</strong>
                                <small>No longer visible to users</small>
                            </span>
                        </button>
                        <button type="button" role="menuitem" data-report-view-switch="resolved">
                            <i class="fas fa-circle-check announcement-action-icon" aria-hidden="true"></i>
                            <span class="announcement-reports-view-option">
                                <strong>Resolved reports</strong>
                                <small>Marked as no issue found</small>
                            </span>
                        </button>
                    </div>
                </div>
            </div>

            <section class="announcement-reports-list" id="announcementReportsList" aria-label="Reported posts">
                <div class="announcement-reports-empty announcement-reports-empty--loading" role="status">
                    <span class="announcement-reports-empty__icon" aria-hidden="true"><i class="fas fa-spinner fa-spin"></i></span>
                    <h3>Loading feedback</h3>
                    <p>Checking for reports from the school community.</p>
                </div>
            </section>

            <dialog class="announcement-report-reasons-dialog" id="announcementReportReasonsDialog" aria-labelledby="announcementReportReasonsTitle">
                <div class="announcement-report-reasons-dialog__panel">
                    <header class="announcement-report-reasons-dialog__header">
                        <div>
                            <p class="announcement-report-label">Community feedback</p>
                            <h2 id="announcementReportReasonsTitle">Report Reason/s</h2>
                        </div>
                        <button type="button" class="announcement-report-reasons-dialog__close" data-close-report-reasons aria-label="Close report reasons">
                            <i class="fas fa-times" aria-hidden="true"></i>
                        </button>
                    </header>
                    <div class="announcement-report-reasons-dialog__body" id="announcementReportReasonsBody"></div>
                </div>
            </dialog>

            <dialog class="announcement-report-reasons-dialog announcement-report-post-dialog" id="announcementReportPostDialog" aria-labelledby="announcementReportPostTitle">
                <div class="announcement-report-reasons-dialog__panel">
                    <header class="announcement-report-reasons-dialog__header">
                        <div>
                            <h2 id="announcementReportPostTitle">View post</h2>
                        </div>
                        <button type="button" class="announcement-report-reasons-dialog__close" data-close-report-post aria-label="Close post preview">
                            <i class="fas fa-times" aria-hidden="true"></i>
                        </button>
                    </header>
                    <div class="announcement-report-reasons-dialog__body announcement-report-post-dialog__body" id="announcementReportPostBody"></div>
                </div>
            </dialog>
