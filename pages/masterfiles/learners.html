        /* Improved form field styling */
        .form-control {
            transition: border-color 0.2s, box-shadow 0.2s;

            z-index: 1000;
            max-height: 300px;

        }

        .suggestion-item {

            cursor: pointer;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: var(--gray-100);
        }

        .suggestion-item.selected {
            background: var(--deped-blue-light);
        }

        .suggestion-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 13px;
            flex-shrink: 0;
        }

        .suggestion-details {
            flex: 1;
            min-width: 0;
        }

        .suggestion-name {
            font-weight: 500;
            color: var(--gray-900);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }

        .suggestion-meta {
            font-size: 12px;
            color: var(--gray-600);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .suggestion-lrn {
            font-family: monospace;
            font-weight: 400;
        }

        .suggestion-grade {
            font-weight: 500;
        }

        .no-suggestions {

            color: var(--gray-600);

            padding: 12px;

            color: var(--gray-600);
            font-size: 13px;
        }

            margin-right: 6px;

        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 640px; /* 20% smaller than 800px */

        /* Ensure suggestions don't exceed container */
