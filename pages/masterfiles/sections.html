    <style>
        /* Filter bar with cascading selects */
        .sm-filter-bar {
            background: var(--surface-0);
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .sm-filter-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .sm-filter-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .sm-filter-group select {
            min-height: var(--control-min-height);
            font-size: var(--control-font-size);
            padding: var(--control-padding-y) var(--control-padding-x);
            border: 1px solid var(--gray-300);
            border-radius: 0.375rem;
            background: var(--surface-0);
            color: var(--gray-800);
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .sm-filter-group select:focus {
            outline: none;
            border-color: var(--deped-blue);
            box-shadow: 0 0 0 3px rgba(0, 85, 164, 0.1);
        }
        .sm-filter-group select:disabled {
            background: var(--gray-100);
            color: var(--gray-400);
            cursor: not-allowed;
        }

        /* Context badge */
        .sm-context-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--deped-blue-light);
            border: 1px solid var(--deped-blue);
            color: var(--deped-blue);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.75rem;
            border-radius: 99px;
        }

        /* Toolbar */
        .sm-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .sm-toolbar-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .sm-toolbar-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-left: auto;
        }
        .sm-page-actions {
            position: relative;
            display: flex;
            align-items: center;
            flex: 0 0 auto;
        }
        .sm-page-actions .mf-options-icon-btn {
            width: 44px;
            min-width: 44px;
            height: 44px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .sm-page-actions .mf-options-menu {
            right: 0;
            min-width: 220px;
        }
        .sm-sections-header {
            align-items: flex-end;
        }
        body.academic-setup-page .sm-sections-card,
        body.academic-setup-page .setup-modal-content,
        body.academic-setup-page .setup-modal-body {
            overflow: visible;
        }
        body.academic-setup-page .setup-field .choices {
            margin-bottom: 0;
        }
        .sm-sections-header .sm-filter-group {
            flex: 1 1 190px;
            min-width: 180px;
        }
        .sm-sections-header .sm-filter-group select {
            width: 100%;
        }
        .sm-header-tools {
            display: flex;
            align-items: flex-end;
            flex: 1.35 1 300px;
            min-width: 280px;
            gap: 0.75rem;
        }
        .sm-header-tools .search-box {
            flex: 1 1 auto;
            max-width: none;
        }
        .sm-sections-header .sm-header-tools .search-box {
            order: 0;
        }
        .sm-sections-header .sm-header-tools .sm-page-actions {
            order: 1;
        }
        @media (max-width: 560px) {
            .sm-header-tools {
                width: 100%;
                min-width: 0;
            }
            .sm-page-actions .mf-options-menu {
                right: 0.25rem;
                width: min(260px, calc(100vw - 2rem));
            }
        }

        /* Occupancy mini bar */
        .occupancy-bar-wrap { display: flex; align-items: center; gap: 0.5rem; min-width: 100px; }
        .occupancy-bar {
            flex: 1;
            height: 6px;
            background: var(--gray-200);
            border-radius: 99px;
            overflow: hidden;
        }
        .occupancy-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.4s ease;
        }
        .occupancy-bar-fill.low  { background: var(--color-success); }
        .occupancy-bar-fill.mid  { background: var(--color-warning); }
        .occupancy-bar-fill.high { background: var(--color-danger); }
        .occupancy-pct { font-size: 0.78rem; color: var(--gray-500); white-space: nowrap; }

        /* Stats chips */
        .sm-stats {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }
        .sm-stat {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 0.4rem;
            padding: 0.5rem 0.9rem;
            font-size: 0.82rem;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .sm-stat strong {
            color: var(--gray-800);
            font-size: 0.95rem;
        }

        /* Empty state */
        .sm-empty-prompt {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--gray-400);
        }
        .sm-empty-prompt i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            color: var(--gray-300);
        }
        .sm-empty-prompt h3 {
            font-size: 1.1rem;
            color: var(--gray-600);
            margin-bottom: 0.5rem;
        }
        .sm-empty-prompt p {
            font-size: 0.9rem;
        }

        /* Loading skeleton */
        .sm-skeleton {
            background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 0.4rem;
            height: 100px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Error validation border */
        .form-control.error {
            border-color: var(--color-danger);
        }
        .error-message {
            color: var(--color-danger);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
    </style>

                    <select id="filterSY" onchange="smOnSYChange()">
                        <option value="">— Loading... —</option>

    <!-- ── Add / Edit Section Modal ── -->
    <div class="modal setup-modal" id="sectionModal" aria-hidden="true">
        <div class="modal-content setup-modal-content">
            <div class="modal-header setup-modal-header">
                <h2 class="modal-title setup-modal-title" id="sectionModalTitle">Add Section</h2>
                <button class="modal-close btn btn-outline icon-btn" type="button" onclick="smCloseModal()">&times;</button>
            </div>
            <div class="modal-body setup-modal-body">
                <form id="sectionForm" autocomplete="off">
                    <input type="hidden" id="smSectionId">

                    <!-- Context (read-only info) -->
                    <div class="form-section section-modal-context">
                        <div class="section-modal-context-items">
                            <div>
                                <span class="section-modal-context-label">School Year</span>
                                <span id="smCtxSY" class="section-modal-context-value">—</span>
                            </div>
                            <div id="smCtxGLGroup">
                                <span class="section-modal-context-label">Grade Level</span>
                                <span id="smCtxGL" class="section-modal-context-value">—</span>
                            </div>
                        </div>
                    </div>

                    <div class="section-modal-fields">
                        <!-- Grade Level selector is shown when the page filter is set to All Grade Levels. -->
                        <div class="form-group setup-field" id="smModalGradeGroup" style="display:none;">
                            <label for="smModalGradeId">Grade Level <span class="required">*</span></label>
                            <select id="smModalGradeId" class="form-control"></select>
                            <div class="error-message" id="errModalGradeId"></div>
                        </div>
                        <div class="form-group setup-field">
                            <label for="smSectionName">Section Name <span class="required">*</span></label>
                            <input type="text" id="smSectionName" class="form-control" placeholder="e.g. Gemini, Gold, Section A" maxlength="100" required>
                            <div class="error-message" id="errSectionName"></div>
                        </div>
                        <div class="form-group setup-field">
                            <label for="smMaxCapacity">Max Capacity <span class="required">*</span></label>
                            <input type="number" id="smMaxCapacity" class="form-control" value="45" min="1" max="60" required>
                            <div class="error-message" id="errMaxCapacity"></div>
                        </div>
                        <div class="form-group setup-field">
                            <label for="smAdviserId">Class Adviser</label>
                            <select id="smAdviserId" class="form-control" data-search-enabled="true" data-search-placeholder="Search advisers...">
                                <option value="">— No adviser assigned —</option>
                            </select>
                            <div class="error-message" id="errAdviserId"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer setup-modal-footer">
                <button class="btn btn-outline" onclick="smCloseModal()">Cancel</button>
                <button class="btn btn-primary" onclick="smSaveSection()">
                    <i class="fas fa-save"></i>
                    <span id="smSaveBtnText">Save Section</span>
                </button>
            </div>
        </div>

                    <i class="fas fa-edit"></i> Edit
