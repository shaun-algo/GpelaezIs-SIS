    <style>
        .setup-layout {
            display: grid;
            grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
            gap: 1rem;
            align-items: start;
        }
        .setup-panel {
            background: var(--surface-0);
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            padding: 1rem;
            overflow: visible;
        }
        .setup-panel h2 {
            font-size: 1rem;
            margin: 0 0 0.85rem;
            color: var(--gray-900);
        }
        .setup-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }
        .setup-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .setup-field.full {
            grid-column: 1 / -1;
        }
        .setup-field label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .setup-field input,
        .setup-field select {
            min-height: var(--control-min-height);
            font-size: var(--control-font-size);
            padding: var(--control-padding-y) var(--control-padding-x);
            border: 1px solid var(--gray-300);
            border-radius: 0.375rem;
            background: var(--surface-0);
            color: var(--gray-800);
        }
        .setup-field select {
            position: relative;
            z-index: 2;
        }
        .setup-field input[readonly] {
            background: var(--gray-50);
            color: var(--gray-700);
            font-weight: 700;
        }
        .setup-field input:focus,
        .setup-field select:focus {
            outline: none;
            border-color: var(--deped-blue);
            box-shadow: 0 0 0 3px rgba(0, 85, 164, 0.1);
        }
        .setup-field .error-message {
            min-height: 1rem;
            font-size: 0.75rem;
            color: var(--color-danger);
        }
        .setup-field.is-error input,
        .setup-field.is-error select {
            border-color: var(--color-danger);
        }
        .setup-field.is-unsaved > label::after {
            content: 'Unsaved';
            display: inline-flex;
            margin-left: 0.45rem;
            color: #9a6700;
            font-size: 0.62rem;
            font-weight: 750;
            letter-spacing: 0.02em;
            text-transform: none;
        }
        .setup-field.is-unsaved input,
        .setup-field.is-unsaved select,
        .setup-field.is-unsaved [id$='Display'] {
            border-color: #d39a32 !important;
            background: #fff8e7 !important;
            box-shadow: 0 0 0 3px rgba(211, 154, 50, 0.14) !important;
        }
        #sectionsBody.is-unsaved {
            outline: 2px solid rgba(211, 154, 50, 0.68);
            outline-offset: -2px;
            background: #fffdf5;
        }
        .setup-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: var(--gray-700);
            margin-top: 0.25rem;
        }
        .setup-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }
        .setup-summary {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }
        .setup-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 999px;
            padding: 0.4rem 0.7rem;
            font-size: 0.78rem;
            color: var(--gray-700);
        }
        .sections-table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
        }
        .sections-setup-table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .sections-setup-table th,
        .sections-setup-table td {
            height: 44px;
            padding: 0.55rem 0.65rem;
            border-bottom: 1px solid var(--gray-200);
            border-right: 1px solid var(--gray-200);
            text-align: left;
            vertical-align: middle;
            line-height: 1.35;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: normal;
        }
        .sections-setup-table th:last-child,
        .sections-setup-table td:last-child {
            border-right: none;
        }
        .sections-setup-table th {
            background: var(--gray-50);
            color: var(--gray-600);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .sections-setup-table tr:last-child td {
            border-bottom: none;
        }
        .sections-setup-table td:nth-child(1),
        .sections-setup-table td:nth-child(4),
        .sections-setup-table td:nth-child(5) {
            white-space: nowrap;
        }
        .sections-setup-table td:nth-child(2),
        .sections-setup-table td:nth-child(3) {
            min-height: 44px;
        }
        .sections-setup-table .text-center {
            text-align: center;
        }
        .sections-setup-table td.text-center {
            white-space: nowrap;
        }
        .sections-setup-table td.text-center .icon-btn {
            margin: 0 0.1rem;
            vertical-align: middle;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.35rem;
        }
        .setup-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        #saveSetupBtn.is-unsaved {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
        }
        .setup-empty {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--gray-500);
        }
        .setup-alert {
            display: none;
            margin-bottom: 1rem;
            border: 0;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            background: var(--gray-50);
            color: var(--gray-700);
            box-shadow: var(--shadow-sm);
        }
        .setup-alert.show {
            display: block;
        }
        .setup-alert.success {
            background: #F0FDF4;
            color: #166534;
        }
        .setup-alert.error {
            background: #FEF2F2;
            color: #991B1B;
        }
        .setup-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1300;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.45);
            padding: 1rem;
        }
        .setup-modal.show {
            display: flex;
        }
        .setup-modal-content {
            width: min(560px, 100%);
            background: var(--surface-0);
            border-radius: 0.5rem;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
            overflow: visible;
            position: relative;
            z-index: 1301;
        }
        .setup-modal-header,
        .setup-modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }
        .setup-modal-footer {
            justify-content: flex-end;
            border-top: 1px solid var(--gray-200);
            border-bottom: none;
        }
        .setup-modal-title {
            margin: 0;
            font-size: 1rem;
            color: var(--gray-900);
        }
        .setup-modal-body {
            padding: 1rem;
            overflow: visible;
        }
        #sectionModal select,
        #sectionModal option,
        #sectionModal .choices,
        #sectionModal .choices__inner,
        #sectionModal .choices__list--dropdown,
        #sectionModal .choices__list[aria-expanded] {
            z-index: 1305;
        }
        .setup-panel select,
        .setup-panel option,
        .setup-panel .choices,
        .setup-panel .choices__inner,
        .setup-panel .choices__list--dropdown,
        .setup-panel .choices__list[aria-expanded] {
            z-index: 900;
        }
        @media (max-width: 980px) {
            .setup-layout {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 640px) {
            .setup-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

        <div class="setup-alert" id="setupAlert"></div>

        <div class="setup-layout">
            <section class="setup-panel">
                <h2><i class="fas fa-calendar-plus"></i> School Year</h2>
                <div class="setup-grid">
                    <div class="setup-field">
                        <label for="setupYearStart">Year Start</label>
                        <input id="setupYearStart" type="number" min="2000" max="2100">
                        <div class="error-message"></div>
                    </div>
                    <div class="setup-field">
                        <label for="setupYearEnd">Year End</label>
                        <input id="setupYearEnd" type="number" readonly>
                        <div class="error-message"></div>
                    </div>
                    <div class="setup-field full">
                        <label for="setupYearLabel">Generated Label</label>
                        <input id="setupYearLabel" type="text" readonly>
                        <div class="error-message"></div>
                    </div>
                    <div class="setup-field full">
                        <label for="setupActiveCurriculum">Active Curriculum (automatic)</label>
                        <input id="setupActiveCurriculum" type="text" readonly aria-describedby="setupActiveCurriculumError">
                        <div class="error-message" id="setupActiveCurriculumError" role="alert"></div>
                    </div>
                    <div class="setup-field setup-date-field" data-date-picker-field="start">
                        <label for="setupDateStartDisplay">Start Date</label>
                        <input id="setupDateStart" type="hidden">
                        <button id="setupDateStartDisplay" class="setup-date-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="setupDateStartPicker" aria-describedby="setupDateStartError">
                            <span class="setup-date-trigger-value">Choose start date</span>
                            <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                        </button>
                        <div class="error-message" id="setupDateStartError"></div>
                        <div class="setup-date-picker" id="setupDateStartPicker" role="dialog" aria-label="Choose start date" hidden></div>
                    </div>
                    <div class="setup-field setup-date-field" data-date-picker-field="end">
                        <label for="setupDateEndDisplay">End Date</label>
                        <input id="setupDateEnd" type="hidden">
                        <button id="setupDateEndDisplay" class="setup-date-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="setupDateEndPicker" aria-describedby="setupDateEndError">
                            <span class="setup-date-trigger-value">Choose end date</span>
                            <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                        </button>
                        <div class="error-message" id="setupDateEndError"></div>
                        <div class="setup-date-picker" id="setupDateEndPicker" role="dialog" aria-label="Choose end date" hidden></div>
                    </div>
                    <div class="setup-field full">
                        <label for="setupGradingSystem">Periods Number Type</label>
                        <select id="setupGradingSystem" required><option value="">Select periods number type</option></select>
                        <div class="error-message"></div>
                    </div>
                    <div class="setup-field full setup-periods-field" id="setupPeriodsField" hidden>
                        <div class="setup-periods-heading">
                            <label id="setupPeriodsTitle">Grading Period Dates</label>
                        </div>
                        <div class="setup-periods-table-wrap">
                            <table class="setup-periods-table">
                                <thead><tr><th>Period</th><th>Date Range</th></tr></thead>
                                <tbody id="setupPeriodsBody"></tbody>
                            </table>
                        </div>
                        <div class="error-message" id="setupPeriodsError"></div>
                    </div>
                </div>
                <label class="setup-check">
                    <input id="setupIsActive" type="checkbox" checked>
                    Set as active school year
                </label>
            </section>

            <section class="setup-panel">
                <div class="setup-toolbar">
                    <h2><i class="fas fa-school"></i> Sections</h2>
                    <div class="setup-section-toolbar-actions">
                        <button class="btn btn-outline setup-remove-selected" id="removeSelectedSectionsBtn" type="button" hidden disabled>Remove selected</button>
                        <button class="btn btn-primary" id="addSectionBtn" type="button">
                            <i class="fas fa-plus"></i> Add Section
                        </button>
                    </div>
                </div>

                <div class="sections-table-wrap" id="sectionsTableWrap">
                    <table class="sections-setup-table">
                        <thead>
                            <tr>
                                <th class="setup-select-column"><input type="checkbox" id="sectionsSelectAll" aria-label="Select all preview sections"></th>
                                <th style="width:22%;">Grade Level</th>
                                <th>Section Name</th>
                                <th style="width:24%;">Adviser</th>
                                <th style="width:90px;">Capacity</th>
                            </tr>
                        </thead>
                        <tbody id="sectionsBody"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div class="setup-actions">
            <button class="btn btn-outline" id="resetSetupBtn" type="button">
                <i class="fas fa-rotate-left"></i> Reset
            </button>
            <button class="btn btn-primary" id="saveSetupBtn" type="button">
                <i class="fas fa-save"></i> Finalize Setup
            </button>
        </div>
    </main>

    <div class="setup-modal" id="periodDatesModal" aria-hidden="true">
        <div class="setup-modal-content setup-period-modal-content" role="dialog" aria-modal="true" aria-labelledby="periodDatesModalTitle">
            <div class="setup-modal-header">
                <div><p class="setup-modal-kicker">Grading period</p><h2 class="setup-modal-title" id="periodDatesModalTitle">Period 1 dates</h2></div>

            <div class="setup-modal-body">
                <div class="setup-grid">

                        <input id="setupPeriodDateStart" type="hidden">
                        <button id="setupPeriodDateStartDisplay" class="setup-date-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="setupPeriodDateStartPicker" aria-describedby="setupPeriodDateStartError">
                            <span class="setup-date-trigger-value">Choose start date</span><i class="fas fa-calendar-alt" aria-hidden="true"></i>
                        </button>
                        <div class="error-message" id="setupPeriodDateStartError"></div>
                        <div class="setup-date-picker" id="setupPeriodDateStartPicker" role="dialog" aria-label="Choose period start date" hidden></div>
                    </div>
                    <div class="setup-field setup-date-field" data-date-picker-field="period-end">

                        <input id="setupPeriodDateEnd" type="hidden">
                        <button id="setupPeriodDateEndDisplay" class="setup-date-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="setupPeriodDateEndPicker" aria-describedby="setupPeriodDateEndError">
                            <span class="setup-date-trigger-value">Choose end date</span><i class="fas fa-calendar-alt" aria-hidden="true"></i>
                        </button>
                        <div class="error-message" id="setupPeriodDateEndError"></div>
                        <div class="setup-date-picker" id="setupPeriodDateEndPicker" role="dialog" aria-label="Choose period end date" hidden></div>

                </div>
                <div class="error-message setup-period-modal-error" id="periodDatesModalError" role="alert"></div>

            <div class="setup-modal-footer">

                <button class="btn btn-primary" id="savePeriodDatesModalBtn" type="button"><i class="fas fa-check"></i> Save dates</button>
            </div>
        </div>
    </div>

    <div class="setup-modal" id="sectionModal" aria-hidden="true">
        <div class="setup-modal-content">
            <div class="setup-modal-header">
                <h2 class="setup-modal-title" id="sectionModalTitle">Add Section</h2>
                <button class="btn btn-outline icon-btn" id="closeSectionModalBtn" type="button" title="Close">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="setup-modal-body">
                <input type="hidden" id="sectionEditId">
                <div class="setup-grid">
                    <div class="setup-field full">
                        <label for="modalGradeLevel">Grade Level <span class="required">*</span></label>
                        <select id="modalGradeLevel" aria-describedby="modalGradeLevelError"></select>
                        <div class="error-message" id="modalGradeLevelError"></div>
                    </div>
                    <div class="setup-field full">

                        <input id="modalSectionName" type="text" maxlength="100" aria-describedby="modalSectionNameError" required>
                        <div class="error-message" id="modalSectionNameError"></div>
                    </div>
                    <div class="setup-field full">
                        <label for="modalAdviser">Adviser</label>
                        <select id="modalAdviser" data-search-enabled="true" data-search-placeholder="Search advisers..." aria-describedby="modalAdviserError"></select>
                        <div class="error-message" id="modalAdviserError"></div>
                    </div>
                    <div class="setup-field full">

                </div>
            </div>
            <div class="setup-modal-footer">
                <button class="btn btn-outline" id="cancelSectionModalBtn" type="button">Cancel</button>
                <button class="btn btn-primary" id="saveSectionModalBtn" type="button">
                    <i class="fas fa-check"></i> Add to Preview
                </button>
            </div>
        </div>
