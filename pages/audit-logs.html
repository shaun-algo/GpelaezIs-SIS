    <style>
        .audit-filters {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--gray-200);
            background: var(--surface-0);
        }
        .audit-filters .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .audit-filters .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .audit-filters select,
        .audit-filters input[type="date"] {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--gray-300);
            border-radius: 0.5rem;
            font-size: 0.85rem;
            background: var(--surface-0);
            color: var(--gray-900);
            min-height: 36px;
        }
        .audit-filters select:focus,
        .audit-filters input[type="date"]:focus {
            outline: none;
            border-color: var(--deped-blue);
            box-shadow: 0 0 0 3px rgba(0, 85, 164, 0.1);
        }
        .audit-filters .btn-clear-filters {
            align-self: flex-end;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
        .action-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .action-badge.insert {
            background: #d1fae5;
            color: #065f46;
        }
        .action-badge.update {
            background: #dbeafe;
            color: #1e40af;
        }
        .action-badge.delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .audit-summary {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-size: 0.85rem;
            color: var(--gray-700);
            cursor: pointer;
        }
        .audit-summary:hover {
            overflow: visible;
            display: block;
            white-space: normal;
            word-break: break-word;
        }
        .audit-summary .summary-entity {
            font-weight: 600;
            color: var(--gray-900);
        }
        .audit-summary .summary-fields {
            color: var(--gray-500);
            font-size: 0.8rem;
        }
        /* Detail modal */
        .audit-detail-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 0.5rem 1rem;
            font-size: 0.9rem;
        }
        .audit-detail-grid dt {
            font-weight: 600;
            color: var(--gray-600);
        }
        .audit-detail-grid dd {
            color: var(--gray-900);
            margin: 0;
        }
        .audit-json-block {
            background: var(--gray-100);
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            white-space: normal;
            word-break: break-word;
            max-height: 360px;
            overflow-y: auto;
        }
        .audit-diff-title {
            margin: 0 0 0.5rem;
            font-weight: 600;
            color: var(--gray-700);
        }
        .audit-diff-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 0.75rem;
            padding: 0.35rem 0;
            border-bottom: 1px solid var(--gray-200);
        }
        .audit-diff-row.update {
            grid-template-columns: 140px 1fr auto 1fr;
            align-items: center;
        }
        .audit-diff-field {
            font-weight: 600;
            color: var(--gray-700);
        }
        .audit-diff-value {
            color: var(--gray-900);
        }
        .audit-diff-old {
            color: var(--gray-500);
            text-decoration: line-through;
            background: #fee2e2;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
        }
        .audit-diff-new {
            color: var(--gray-900);
            background: #d1fae5;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
        }
        .audit-diff-arrow {
            color: var(--gray-400);
            font-size: 0.75rem;
        }
        .audit-raw-details summary {
            cursor: pointer;
            color: var(--deped-blue);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .audit-raw-details pre {
            background: var(--gray-900);
            color: #e5e7eb;
            border-radius: 0.35rem;
            padding: 0.5rem 0.75rem;
            font-family: monospace;
            font-size: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .audit-json-pair {
            margin-bottom: 0.75rem;
        }
        .text-muted {
            color: var(--gray-500);
            font-style: italic;
        }
    </style>
