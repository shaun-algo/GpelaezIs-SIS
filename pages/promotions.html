        /* Tabs */
        .promo-tabs {
            display: flex;
            gap: 0.25rem;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 1.5rem;
        }
        .promo-tab {
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--gray-600);
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .promo-tab:hover {
            color: var(--deped-blue);
        }
        .promo-tab.active {
            color: var(--deped-blue);
            border-bottom-color: var(--deped-blue);
        }
        .promo-panel {
            display: none;
        }
        .promo-panel.active {
            display: block;
        }

        /* Summary grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .promo-card {
            background: var(--surface-0);
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            padding: 1rem 0.5rem;
            text-align: center;
        }
        .promo-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .promo-card .label {
            font-size: 0.7rem;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-top: 0.25rem;
        }

        /* Status badges */
        .promo-badge {
            display: inline-block;
            padding: 0.35rem 0.7rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .promo-badge.promoted { background: #D1FAE5; color: #065F46; }
        .promo-badge.conditional { background: #FEF3C7; color: #92400E; }
        .promo-badge.retained { background: #FEE2E2; color: #991B1B; }
        .promo-badge.completed { background: #DBEAFE; color: #1E40AF; }
        .promo-badge.uncomputed { background: var(--gray-100); color: var(--gray-600); }
        .promo-badge.yes { background: #D1FAE5; color: #065F46; }
        .promo-badge.no { background: var(--gray-100); color: var(--gray-600); }
        .promo-badge.will_create { background: #D1FAE5; color: #065F46; }
        .promo-badge.will_restore { background: #FFEDD5; color: #9A3412; }
        .promo-badge.already_enrolled { background: var(--gray-200); color: var(--gray-600); }
        .promo-badge.no_section { background: #FEE2E2; color: #991B1B; }

        /* Filter bar */
        .sm-filter-bar {
            background: var(--surface-0);
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .sm-filter-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .sm-filter-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .sm-filter-group select,
        .sm-filter-group input {
            min-height: var(--control-min-height);
            font-size: var(--control-font-size);
            padding: var(--control-padding-y) var(--control-padding-x);
            border: 1px solid var(--gray-300);
            border-radius: 0.375rem;
            background: var(--surface-0);
            color: var(--gray-800);
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .sm-filter-group input { cursor: text; }
        .sm-filter-group select:focus,
        .sm-filter-group input:focus {
            outline: none;
            border-color: var(--deped-blue);
            box-shadow: 0 0 0 3px rgba(0, 85, 164, 0.1);
        }

        /* Empty / loading */
        .sm-empty-prompt {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--gray-400);
        }
        .sm-empty-prompt i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            color: var(--gray-300);
        }
        .sm-empty-prompt h3 {
            font-size: 1.1rem;
            color: var(--gray-600);
            margin-bottom: 0.5rem;
        }
        .sm-empty-prompt p {
            font-size: 0.9rem;
        }

        /* Disabled button */
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* History modal table */
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th,
        .history-table td {
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.85rem;
            text-align: left;
        }
        .history-table th {
            background: var(--deped-blue);
            color: white;
            font-weight: 600;
        }
        .history-table tr:hover {
            background: var(--gray-50);
        }

        /* Teacher re-enroll gender columns */
        .teacher-gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .teacher-gender-box {
            background: var(--surface-0);
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            padding: 1rem;
        }
        .teacher-gender-box h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .teacher-learner-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 420px;
            overflow-y: auto;
        }
        .teacher-learner-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 0.7rem;
            border-radius: 0.35rem;
            border: 1px solid var(--gray-100);
            background: var(--gray-50);
            font-size: 0.9rem;
        }
        .teacher-learner-item:hover {
            background: var(--gray-100);
        }
        .teacher-learner-item input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            flex-shrink: 0;
        }
        .teacher-learner-name {
            flex: 1;
            min-width: 0;
        }
        .teacher-learner-lrn {
            font-size: 0.78rem;
            color: var(--gray-500);
        }
        @media (max-width: 768px) {
            .teacher-gender-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
