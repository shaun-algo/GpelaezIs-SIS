    <link rel="stylesheet" href="../assets/css/mobile-polish.css?v=20261014-responsive-long-names-v1">
</head>
<body class="announcement-dashboard">
    <!-- Logo Loading Screen -->
    <div class="logo-loader" id="logoLoader" aria-hidden="true">
        <div class="logo-loader-content">
            <img src="../assets/img/logo/logo.png" alt="G. Pelaez Integrated School Logo" class="logo-loader-image" />
        </div>

    <nav class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="logo">
                <img src="../assets/img/logo/logo.png" alt="School Logo" class="logo-img">
                <div class="logo-text">
                    <h1>G.Pelaez Integrated School</h1>
                    <p>Teacher Portal</p>
                </div>
            </div>
        </div>

        <div class="topbar-right">
            <button class="notification-btn" id="notificationBtn" type="button">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="notificationCount">0</span>
            </button>

            <div class="user-menu">
                <button class="user-btn" id="userMenuBtn" aria-label="Open profile menu" aria-haspopup="true" aria-expanded="false" type="button">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-name">Teacher</span>
                        <span class="user-role">Teacher</span>
                    </div>
                    <span class="profile-menu-indicator" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </button>

                <div class="user-dropdown" id="userDropdown">
                    <a href="../pages/profile.html"><i class="fas fa-user"></i> Profile</a>
                    <a href="../pages/settings.html"><i class="fas fa-cog"></i> Settings</a>
                    <hr>
                    <a href="../logout.php" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar"><nav class="sidebar-nav"><ul class="nav-list"></ul></nav></aside>

    <main class="main-content" id="mainContent">
        <div id="homeSection" class="content-section active">
            <nav class="breadcrumb">
                <a href="#home"><i class="fas fa-home"></i> Home</a>
            </nav>

            <section class="announcement-composer-top" data-animate="fade-right" aria-label="Compose announcement">
                <div class="compose-card" id="composeCard" role="button" tabindex="0" aria-label="Open create announcement form" onclick="openComposeModal()">
                    <div class="compose-row">
                        <div class="compose-avatar user-avatar" role="img" aria-label="Your profile avatar">
                            U
                        </div>
                        <button class="compose-field" id="composeField" type="button" onclick="event.stopPropagation(); openComposeModal();">
                            What's new for learners, teachers, and parents?
                        </button>
                    </div>
                </div>
            </section>

            <div class="announcements-container">
                <div class="announcements-feed" id="announcementsFeed">
                    <div class="loading-state" style="text-align: center; padding: 2rem; color: #666;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 1rem;"></i>
                        <p style="font-size: 1rem;">Loading announcements...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Announcement Modal -->
    <div class="modal" id="createAnnouncementModal" role="dialog" aria-modal="true" aria-labelledby="createAnnouncementModalTitle">
        <div class="modal-content modal-lg announcement-composer">
            <div class="modal-header composer-header">
                <h2 class="modal-title" id="createAnnouncementModalTitle">
                    <i class="fas fa-bullhorn"></i>
                    Create Announcement
                </h2>
                <button class="modal-close" id="closeAnnouncementModal" type="button" aria-label="Close announcement form">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="createAnnouncementForm">
                <div class="modal-body composer-body">
                    <div class="composer-author">
                        <div class="author-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="author-info">
                            <strong class="author-name" id="composerUserName">Teacher</strong>
                            <div class="audience-selector">
                                <select id="targetRole" name="target_role_id" class="audience-select">
                                    <option value="">Everyone</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="announcement-message-canvas" id="announcementMessageCanvas">
                    <div class="form-group composer-title-group">
                        <label for="announcementTitle" class="composer-field-label">Title</label>
                        <input type="text"
                               id="announcementTitle"
                               name="title"
                               class="composer-title-input"
                               placeholder="What's the headline?"
                               required
                               maxlength="200">
                        <div class="title-counter">
                            <span id="titleCounter">0</span>/200
                        </div>
                    </div>

                    <div class="form-group composer-content-group">
                        <label for="announcementBody" class="composer-field-label">Message</label>
                        <textarea id="announcementBody"
                                  name="body"
                                  class="composer-textarea"
                                  placeholder="Share important updates, news, or announcements with your community..."
                                  required
                                  rows="6"></textarea>
                        <div class="content-counter">
                            <span id="contentCounter">0</span> characters
                        </div>
                    </div>

                    <button type="button" class="announcement-background-trigger" id="announcementBackgroundToggle" aria-expanded="false" aria-controls="announcementBackgroundControl">
                        <span aria-hidden="true">Aa</span>
                        <span class="sr-only">Choose message background</span>
                    </button>
                    <div class="announcement-background-control" id="announcementBackgroundControl" hidden>
                        <button type="button" class="announcement-background-close" id="announcementBackgroundClose" aria-label="Close background choices">
                            <i class="fas fa-arrow-left" aria-hidden="true"></i>
                        </button>
                        <div class="announcement-background-heading">
                            <div>
                                <span class="composer-field-label">Message background</span>
                            </div>
                            <span class="announcement-background-value" id="announcementBackgroundValue">Plain</span>
                        </div>
                        <div class="announcement-background-presets" role="group" aria-label="Message background presets">
                            <button type="button" class="announcement-background-preset is-selected" data-background-preset="plain" aria-pressed="true">
                                <span class="announcement-background-swatch announcement-background-swatch--plain" aria-hidden="true"></span>
                                <span>Plain</span>
                            </button>
                            <button type="button" class="announcement-background-preset" data-background-preset="mist" aria-pressed="false">
                                <span class="announcement-background-swatch" style="background: linear-gradient(135deg, #3e5870 0%, #7e9bb8 100%);" aria-hidden="true"></span>
                                <span>Mist</span>
                            </button>
                            <button type="button" class="announcement-background-preset" data-background-preset="sage" aria-pressed="false">
                                <span class="announcement-background-swatch" style="background: linear-gradient(135deg, #294d3b 0%, #6e9b7a 100%);" aria-hidden="true"></span>
                                <span>Sage</span>
                            </button>
                            <button type="button" class="announcement-background-preset" data-background-preset="sand" aria-pressed="false">
                                <span class="announcement-background-swatch" style="background: linear-gradient(135deg, #6f4d2d 0%, #b68a54 100%);" aria-hidden="true"></span>
                                <span>Sand</span>
                            </button>
                            <button type="button" class="announcement-background-preset" data-background-preset="blush" aria-pressed="false">
                                <span class="announcement-background-swatch" style="background: linear-gradient(135deg, #6e3545 0%, #b87887 100%);" aria-hidden="true"></span>
                                <span>Blush</span>
                            </button>
                            <button type="button" class="announcement-background-preset" data-background-preset="lavender" aria-pressed="false">
                                <span class="announcement-background-swatch" style="background: linear-gradient(135deg, #4b3b72 0%, #8974bd 100%);" aria-hidden="true"></span>
                                <span>Lavender</span>
                            </button>
                        </div>
                        <div class="announcement-message-preview" id="announcementMessagePreview">
                            <span class="announcement-message-preview__label">Preview</span>
                            <span data-preview-copy>Your message will look like this.</span>
                        </div>
                        <input type="hidden" id="messageBackground" value="#ffffff">
                    </div>
                    </div>

                    <div class="composer-advanced">
                        <button type="button" class="advanced-toggle" id="advancedToggle">
                            <i class="fas fa-cog"></i>
                            Advanced Options
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </button>
                        <div class="advanced-options" id="advancedOptions" style="display: none;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="expiresAt" class="form-label">
                                        <i class="fas fa-calendar-times"></i> Expiration Date
                                    </label>
                                    <input type="datetime-local" id="expiresAt" name="expires_at" class="form-control">
                                    <small class="form-hint">Leave blank for no expiration</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer composer-footer">
                    <div class="composer-submit">
                        <button type="button" class="btn btn-outline btn-sm" id="cancelAnnouncementBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-post" id="submitAnnouncementBtn">
                            <i class="fas fa-paper-plane"></i> Post
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/dashboard.js?v=20261014-responsive-long-names-v1"></script>
    <script src="../assets/js/components/announcement-background.js?v=20260924-plain-default"></script>
    <script src="../js/dashboard-announcements.js?v=20261008-empty-media-v1"></script>
    <script src="../assets/js/components/logo-loader.js?v=20261002-logo-assets-v1"></script>
</body>
</html>
